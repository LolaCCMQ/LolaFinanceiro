<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lola · Financeiro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F5F4F2; --card:#ffffff; --vinho:#8B2635; --vinho-deep:#6f1d2a; --vinho-pale:#FDF0F1;
    --ink:#241016; --muted:#8a7077; --border:#e7dadd; --green:#2D6A4F; --red:#C0392B; --warm:#F2EDE8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter','Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  #gate{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
  #gate.hidden{display:none}
  .gate-box{background:#fff;border-radius:18px;padding:32px 28px;box-shadow:0 8px 40px rgba(139,38,53,.15);width:100%;max-width:360px;border-top:3px solid var(--vinho)}
  .gate-logo{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:800;font-size:1.8rem;color:var(--vinho);text-align:center}
  .gate-sub{text-align:center;color:var(--muted);font-size:.85rem;margin:4px 0 18px}
  .gate-box label{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px}
  .gate-box select,.gate-box input{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:9px;font-size:.95rem;background:#fff;color:var(--ink);outline:none;font-family:inherit;margin-bottom:12px}
  .gate-box select:focus,.gate-box input:focus{border-color:var(--vinho)}
  .gate-btn{width:100%;padding:11px;background:var(--vinho);color:#fff;border:none;border-radius:9px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit}
  .gate-btn:hover{background:var(--vinho-deep)}
  .gate-err{color:var(--vinho);font-size:.82rem;text-align:center;min-height:16px;margin-top:6px}
  #app{display:none;flex-direction:column;min-height:100vh}
  #app.show{display:flex}
  .top{background:#fff;border-bottom:3px solid var(--vinho);display:flex;align-items:center;justify-content:space-between;padding:10px 18px;position:sticky;top:0;z-index:50;flex-wrap:wrap;gap:10px}
  .brand{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:800;font-size:1.4rem;color:var(--vinho)}
  .unit-toggle{display:flex;gap:6px}
  .unit-btn{padding:7px 14px;border-radius:40px;border:2px solid var(--vinho);background:#fff;color:var(--vinho);font-weight:700;font-size:.82rem;cursor:pointer;font-family:inherit}
  .unit-btn.active{background:var(--vinho);color:#fff}
  .top-right{display:flex;align-items:center;gap:10px}
  .who{font-size:.82rem;color:var(--muted)}
  .logout{background:none;border:none;color:var(--muted);font-size:.78rem;cursor:pointer}
  .logout:hover{color:var(--vinho)}
  .layout{display:flex;flex:1;min-height:0}
  .side{width:210px;background:#fff;border-right:1.5px solid var(--border);padding:14px 8px;flex-shrink:0}
  .side .sec{font-size:.62rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:12px 10px 4px}
  .nav{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:.86rem;font-weight:600;color:var(--ink);border:none;background:none;width:100%;text-align:left;font-family:inherit}
  .nav:hover{background:var(--warm)}
  .nav.active{background:var(--vinho-pale);color:var(--vinho)}
  .main{flex:1;padding:22px 26px;overflow-y:auto;min-width:0}
  h1.page{font-family:'Playfair Display',Georgia,serif;font-style:italic;color:var(--vinho);font-size:1.6rem;margin-bottom:2px}
  .page-sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:9px;border:none;font-family:inherit;font-size:.84rem;font-weight:700;cursor:pointer;transition:all .15s}
  .btn-p{background:var(--vinho);color:#fff}.btn-p:hover{background:var(--vinho-deep)}
  .btn-o{background:#fff;border:1.5px solid var(--vinho);color:var(--vinho)}.btn-o:hover{background:var(--vinho-pale)}
  .btn-g{background:var(--warm);color:var(--ink);border:1.5px solid var(--border)}
  .btn-d{background:#FEE2E2;color:var(--red)}
  .btn-sm{padding:5px 10px;font-size:.76rem}
  input.in,select.in,textarea.in{font-family:inherit;font-size:.85rem;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);outline:none}
  input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--vinho)}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1.5px solid var(--border)}
  th{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--warm);padding:9px 10px;text-align:left;white-space:nowrap}
  td{padding:7px 10px;font-size:.82rem;border-top:1px solid var(--border);vertical-align:middle}
  tr:hover td{background:#fcfafa}
  .val-pos{color:var(--green);font-weight:700;white-space:nowrap}
  .val-neg{color:var(--red);font-weight:700;white-space:nowrap}
  .pill{font-size:.66rem;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--warm);color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:.9rem}
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(28,8,8,.45);z-index:200;align-items:center;justify-content:center;padding:16px}
  .modal-bg.open{display:flex}
  .modal{background:#fff;border-radius:18px;padding:24px;width:460px;max-width:96vw;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .modal h2{font-family:'Playfair Display',Georgia,serif;color:var(--vinho-deep);font-size:1.2rem;margin-bottom:14px}
  .fg{margin-bottom:12px}
  .fg label{display:block;font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .fg input,.fg select,.fg textarea{width:100%}
  .fg2{display:flex;gap:10px}.fg2>div{flex:1}
  .totrow{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);font-size:.88rem}
  .grouphead{font-weight:800;color:var(--vinho);background:var(--vinho-pale);padding:9px 12px;border-radius:8px;margin:14px 0 4px;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em}
  .result-card{background:var(--vinho);color:#fff;border-radius:14px;padding:16px 20px;margin-top:16px;display:flex;justify-content:space-between;align-items:center}
  .result-card .lbl{font-size:.8rem;opacity:.85;text-transform:uppercase;letter-spacing:.05em}
  .result-card .v{font-size:1.5rem;font-weight:800}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;font-size:.84rem;z-index:9999;transition:transform .3s;pointer-events:none}
  #toast.show{transform:translateX(-50%) translateY(0)}
  .spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--vinho);border-radius:50%;animation:sp .8s linear infinite;margin:30px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(max-width:760px){ .side{display:none} .main{padding:16px 14px} .top{padding:10px 12px} }
  @media print{ .top,.side,.bar,.no-print{display:none!important} .main{padding:0} body{background:#fff} }
  .catbtn{background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:5px 9px;font-family:inherit;font-size:.8rem;cursor:pointer;max-width:190px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .catbtn:hover{border-color:var(--vinho)}
  .catbtn-empty{color:var(--muted)}
  .catpick{position:absolute;z-index:300;background:#fff;border:1.5px solid var(--vinho);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px;width:264px;max-height:320px;overflow-y:auto;display:none}
  .catgrp{font-size:.62rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:7px 6px 2px}
  .catopt{padding:6px 9px;border-radius:7px;cursor:pointer;font-size:.84rem}
  .catopt:hover{background:var(--vinho-pale);color:var(--vinho)}
  .gate-logo-img{display:block;height:52px;margin:0 auto 2px}
  .brand-img{height:34px;display:block}
  html.embed .brand-img, html.embed .logout{display:none}
  html.embed .top{padding-top:6px;padding-bottom:6px}
</style>
</head>

async function sha256hex(msg){
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function R(v){const n=parseFloat(v)||0;return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function fmtData(s){if(!s)return'';const p=String(s).slice(0,10).split('-');return p.length===3?(p[2]+'/'+p[1]+'/'+p[0]):s;}
function mesLabel(m){const a=m.split('-');const nomes=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];return (nomes[parseInt(a[1])]||a[1])+'/'+a[0];}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}

function closeModal(){document.getElementById('modalBg').classList.remove('open');}
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal();});

async function rpc(fn,args){
  const res=await fetch(SUPA_URL+'/rest/v1/rpc/'+fn,{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY},
    body:JSON.stringify(Object.assign({p_admin_name:ADMIN.name,p_admin_hash:ADMIN.hash},args||{}))
  });
  let data=null; try{data=await res.json();}catch(e){}
  if(!res.ok) throw new Error((data&&(data.message||data.error))||('Erro '+res.status));
  return data;
}

async function carregarNomes(){
  try{
    const res=await fetch(SUPA_URL+'/rest/v1/rpc/portal_login_names',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY},body:'{}'});
    const data=await res.json();
    if(Array.isArray(data)){
      const sel=document.getElementById('gName');
      sel.innerHTML='<option value="">Selecione...</option>'+data.map(u=>'<option value="'+esc(u.name)+'">'+esc(u.name)+'</option>').join('');
    }
  }catch(e){}
}
async function entrar(){
  const name=document.getElementById('gName').value;
  const pass=document.getElementById('gPass').value;
  const err=document.getElementById('gErr');
  if(!name||!pass){err.textContent='Preencha nome e senha.';return;}
  err.textContent='Verificando...';
  try{
    const hash=await sha256hex(pass);
    const res=await fetch(SUPA_URL+'/rest/v1/rpc/portal_admin_check',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY},body:JSON.stringify({p_admin_name:name,p_admin_hash:hash})});
    const ok=await res.json();
    if(ok!==true){err.textContent='Acesso negado. Apenas administradoras.';return;}
    ADMIN.name=name; ADMIN.hash=hash;
    sessionStorage.setItem('fin_admin',JSON.stringify(ADMIN));
    iniciar();
  }catch(e){err.textContent='Erro de conexão.';}
}
function sair(){ sessionStorage.removeItem('fin_admin'); location.reload(); }
async function iniciar(){
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.add('show');

  await carregar();
}

const PLANO_PADRAO=[
  {g:'receitas',gl:'RECEITAS',t:'receita',cats:['Vendas Restaurante','Vendas Bar','Vendas Café','Eventos','Lojinha','Outras Receitas']},
  {g:'cmv',gl:'CMV',t:'despesa',cats:['Insumos Alimentares','Carnes','Hortifruti','Não Alcoólicos','Bebidas Alcoólicas','Vinhos','Cervejas','Cafés','Pães']},
  {g:'folha',gl:'FOLHA DE PAGAMENTO',t:'despesa',cats:['Salários','Comissões','Pró-Labore','Frilas','Encargos','Benefícios']},
  {g:'operacionais',gl:'DESPESAS OPERACIONAIS',t:'despesa',cats:['Materiais','Gás','CO₂','Terceiros','Marketing','Estrutura/Predial','Operação']},
  {g:'impostos',gl:'IMPOSTOS',t:'despesa',cats:['Simples Nacional','ICMS','PIS/COFINS','IRPJ']},
  {g:'financeiras',gl:'DESPESAS FINANCEIRAS',t:'despesa',cats:['Tarifas Bancárias','IOF','Taxas de Cartão']},
  {g:'retiradas',gl:'RETIRADAS DOS SÓCIOS',t:'despesa',cats:['Retirada Bianca','Retirada Mahara']},
  {g:'investimentos',gl:'INVESTIMENTOS',t:'despesa',cats:['Equipamentos','Obras','Empréstimos']},
];
function slug(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');}
async function carregarPlano(){
  let rows=[];
  try{ rows=await rpc('fin_plano_list',{}); }catch(e){ rows=[]; }
  if(rows && rows.length){
    PLANO=rows.map(r=>({id:r.id,group_id:r.group_id,group_label:r.group_label,group_type:r.group_type,label:r.label}));
  } else {
    PLANO=[];
    let order=0;
    for(const grp of PLANO_PADRAO){
      for(const c of grp.cats){
        const row={id:grp.g+'__'+slug(c),group_id:grp.g,group_label:grp.gl,group_type:grp.t,label:c,parent_id:null,sort_order:order++};
        PLANO.push({id:row.id,group_id:grp.g,group_label:grp.gl,group_type:grp.t,label:c});
        try{ await rpc('fin_plano_save',{p:row}); }catch(e){}
      }
    }
  }
}
function planoGroups(){
  const map={};
  PLANO.forEach(r=>{ if(!map[r.group_id]) map[r.group_id]={id:r.group_id,label:r.group_label,type:r.group_type,cats:[]}; map[r.group_id].cats.push(r); });
  return Object.values(map);
}
function catLabel(id){const r=PLANO.find(x=>x.id===id);return r?r.label:'';}
function catGroup(id){const r=PLANO.find(x=>x.id===id);return r||null;}

  document.getElementById('main').innerHTML='<div class="spin"></div>';
  try{ LANC=await rpc('fin_lancamentos_list',{p_unit:UNIT}) || []; }
  catch(e){ LANC=[]; toast('Erro ao carregar lançamentos'); }
  render();
}

function catOptions(sel){
  let h='<option value="">— categorizar —</option>';
  planoGroups().forEach(g=>{ h+='<optgroup label="'+esc(g.label)+'">'+g.cats.map(c=>'<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+esc(c.label)+'</option>').join('')+'</optgroup>'; });

}

  const totIn=LANC.filter(l=>l.amount>0).reduce((s,l)=>s+ +l.amount,0);

  LANC.forEach(l=>{

      '<td><input class="in" style="width:140px;padding:6px 8px;font-weight:600" type="month" value="'+esc(l.competencia)+'" onchange="setComp(\''+l.id+'\',this.value)"></td>'+
      '<td>'+esc(l.memo)+'</td>'+
      '<td style="text-align:right" class="'+(l.amount<0?'val-neg':'val-pos')+'">'+R(l.amount)+'</td>'+
      '<td><button class="catbtn'+(l.category?'':' catbtn-empty')+'" onclick="openCatPicker(event,\''+l.id+'\')">'+(l.category?esc(catLabel(l.category)):'— categorizar —')+'</button></td>'+
      '<td><input class="in" style="width:120px;padding:4px 6px" value="'+esc(l.note||'')+'" placeholder="..." onchange="setNote(\''+l.id+'\',this.value)"></td>'+

async function saveLanc(patch){
  try{ const r=await rpc('fin_lancamento_save',{p:patch}); const i=LANC.findIndex(x=>x.id===r.id); if(i>=0)LANC[i]=r; else LANC.push(r); return r; }
  catch(e){ toast('Erro ao salvar'); throw e; }
}
async function setComp(id,v){ const l=LANC.find(x=>x.id===id); if(!l)return; l.competencia=v; await saveLanc({id:id,competencia:v}); toast('Competência atualizada'); }
async function setCat(id,v){ const l=LANC.find(x=>x.id===id); if(!l)return; l.category=v; await saveLanc({id:id,category:v}); }
async function setNote(id,v){ const l=LANC.find(x=>x.id===id); if(!l)return; l.note=v; await saveLanc({id:id,note:v}); }
async function delLanc(id){ if(!confirm('Excluir este lançamento?'))return; try{ await rpc('fin_lancamento_delete',{p_id:id}); LANC=LANC.filter(x=>x.id!==id); render(); toast('Excluído'); }catch(e){ toast('Erro ao excluir'); } }

    '<div class="fg2"><div class="fg"><label>Valor (negativo = saída)</label><input class="in" type="number" step="0.01" id="mVal" value="'+(l?l.amount:'')+'" placeholder="-150.00"></div><div class="fg"><label>Categoria</label><select class="in" id="mCat">'+catOptions(l?l.category:'')+'</select></div></div>'+

async function salvarManual(id){
  const data=document.getElementById('mData').value;
  const memo=document.getElementById('mMemo').value.trim();
  const val=parseFloat(document.getElementById('mVal').value);
  if(!data||!memo||isNaN(val)){alert('Preencha data, descrição e valor.');return;}
  const patch={unit:UNIT,date:data,competencia:document.getElementById('mComp').value||data.slice(0,7),memo:memo,amount:val,category:document.getElementById('mCat').value,note:document.getElementById('mNote').value,manual:true};

function modalLote(){
  openModal('<h2>Classificar em lote</h2><div class="page-sub" style="margin-bottom:12px">Aplica uma categoria a todos os lançamentos cuja descrição contenha o texto.</div>'+

    '<div class="fg"><label>Categoria</label><select class="in" id="loteCat">'+catOptions('')+'</select></div>'+

    '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn btn-g" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="aplicarLote()">Aplicar</button></div>');

async function aplicarLote(){
  const txt=document.getElementById('loteTxt').value.trim().toLowerCase();
  const cat=document.getElementById('loteCat').value;
  const all=document.getElementById('loteAll').checked;
  if(!txt||!cat){alert('Informe o texto e a categoria.');return;}
  const alvos=LANC.filter(l=>(l.memo||'').toLowerCase().includes(txt) && (all||!l.category));
  if(!alvos.length){alert('Nenhum lançamento encontrado.');return;}
  if(!confirm('Aplicar a '+alvos.length+' lançamento(s)?'))return;
  closeModal(); toast('Aplicando...');
  for(const l of alvos){ l.category=cat; try{ await saveLanc({id:l.id,category:cat}); }catch(e){} }
  render(); toast('Categorizados: '+alvos.length);
}

document.getElementById('ofxInput').addEventListener('change',function(){ const f=this.files[0]; this.value=''; if(f) lerOFX(f); });
function lerOFX(file){
  const r=new FileReader();
  r.onload=function(){
    let txt;
    try{ txt=new TextDecoder('utf-8',{fatal:false}).decode(r.result); if(/\uFFFD/.test(txt)) txt=new TextDecoder('iso-8859-1').decode(r.result); }
    catch(e){ try{ txt=new TextDecoder('iso-8859-1').decode(r.result); }catch(e2){ txt=''; } }
    try{ processarOFX(txt); }catch(e){ alert('Não consegui ler o OFX: '+e.message); }
  };
  r.readAsArrayBuffer(file);
}
function ofxTag(block,tag){ const m=block.match(new RegExp('<'+tag+'>([^<\\r\\n]*)')); return m?m[1].trim():''; }
function ofxDate(s){ if(!s)return''; const d=s.slice(0,8); return d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8); }
async function processarOFX(text){
  const blocks=text.split(/<STMTTRN>/i).slice(1);
  const rows=[];
  blocks.forEach(b=>{
    const amt=parseFloat((ofxTag(b,'TRNAMT')||'0').replace(',','.'));
    const date=ofxDate(ofxTag(b,'DTPOSTED'));
    const memo=ofxTag(b,'MEMO')||ofxTag(b,'NAME')||'(sem descrição)';
    const fitid=ofxTag(b,'FITID');
    if(!date||isNaN(amt))return;
    rows.push({fitid:fitid,date:date,competencia:date.slice(0,7),memo:memo,amount:amt});
  });
  if(!rows.length){ alert('Nenhum lançamento encontrado no arquivo OFX.'); return; }
  toast('Importando '+rows.length+'...');
  try{
    const n=await rpc('fin_lancamentos_import',{p_unit:UNIT,p_rows:rows});
    await carregar();
    toast(n+' lançamento(s) importado(s)'+(n<rows.length?(' ('+(rows.length-n)+' já existiam)'):''));
  }catch(e){ toast('Erro ao importar'); alert('Erro ao importar: '+e.message); }
}

function mesesDisponiveis(){ const s=new Set(LANC.map(l=>l.competencia)); s.add(fechMes); return [...s].sort().reverse(); }
function renderFech(){
  const m=document.getElementById('main');
  const meses=mesesDisponiveis();
  if(!meses.includes(fechMes)) fechMes=meses[0];
  let h='<h1 class="page">Fechamento do mês · '+UNIT_LABEL[UNIT]+'</h1><div class="page-sub">Totais por grupo, por competência.</div>';
  h+='<div class="bar no-print"><label style="font-size:.8rem;font-weight:700;color:var(--muted)">Competência:</label><select class="in" onchange="fechMes=this.value;render()">'+meses.map(mm=>'<option value="'+mm+'"'+(mm===fechMes?' selected':'')+'>'+mesLabel(mm)+'</option>').join('')+'</select> <button class="btn btn-g" onclick="exportPDF()">🖨️ PDF</button></div>';
  const doMes=LANC.filter(l=>l.competencia===fechMes);
  const groups=planoGroups();
  let totReceita=0, totDespesa=0;
  groups.forEach(g=>{
    const cats=g.cats.map(c=>{ const tot=doMes.filter(l=>l.category===c.id).reduce((s,l)=>s+ +l.amount,0); return {label:c.label,tot:tot}; }).filter(c=>Math.abs(c.tot)>0.001);
    const gtot=cats.reduce((s,c)=>s+c.tot,0);
    if(g.type==='receita')totReceita+=gtot; else totDespesa+=gtot;
    if(!cats.length)return;
    h+='<div class="grouphead">'+esc(g.label)+' · '+R(gtot)+'</div>';
    cats.forEach(c=>{ h+='<div class="totrow"><span>'+esc(c.label)+'</span><span class="'+(c.tot<0?'val-neg':'val-pos')+'">'+R(c.tot)+'</span></div>'; });
  });
  const semCat=doMes.filter(l=>!l.category).reduce((s,l)=>s+ +l.amount,0);
  if(Math.abs(semCat)>0.001){ h+='<div class="grouphead" style="background:#fde8c0;color:#7a4f00">SEM CATEGORIA · '+R(semCat)+'</div>'; }
  const resultado=doMes.reduce((s,l)=>s+ +l.amount,0);
  h+='<div class="result-card"><div><div class="lbl">Resultado do período</div><div style="font-size:.72rem;opacity:.8">Receitas '+R(totReceita)+' · Despesas '+R(totDespesa)+'</div></div><div class="v">'+R(resultado)+'</div></div>';
  m.innerHTML=h;
}

async function planoSave(row){ try{ await rpc('fin_plano_save',{p:row}); }catch(e){ toast('Erro ao salvar plano'); } }
function modalGrupo(){
  openModal('<h2>Novo grupo</h2><div class="fg"><label>Nome do grupo</label><input class="in" id="gpNome" placeholder="Ex: OUTRAS DESPESAS"></div><div class="fg"><label>Tipo</label><select class="in" id="gpTipo"><option value="despesa">Despesa</option><option value="receita">Receita</option></select></div><div class="fg"><label>Primeira categoria</label><input class="in" id="gpCat" placeholder="Ex: Diversos"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-g" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="salvarGrupo()">Criar</button></div>');
}
async function salvarGrupo(){
  const nome=document.getElementById('gpNome').value.trim(); const tipo=document.getElementById('gpTipo').value; const cat=document.getElementById('gpCat').value.trim();
  if(!nome||!cat){alert('Informe o grupo e a primeira categoria.');return;}
  const gid=slug(nome); const row={id:gid+'__'+slug(cat),group_id:gid,group_label:nome.toUpperCase(),group_type:tipo,label:cat,parent_id:null,sort_order:PLANO.length};
  PLANO.push({id:row.id,group_id:gid,group_label:row.group_label,group_type:tipo,label:cat}); await planoSave(row); closeModal(); render(); toast('Grupo criado');
}
function modalCat(gid){
  const g=planoGroups().find(x=>x.id===gid);
  openModal('<h2>Nova categoria · '+esc(g.label)+'</h2><div class="fg"><label>Nome</label><input class="in" id="ncNome" placeholder="Ex: Delivery"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-g" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="salvarCat(\''+gid+'\')">Adicionar</button></div>');
}
async function salvarCat(gid){
  const nome=document.getElementById('ncNome').value.trim(); if(!nome){alert('Informe o nome.');return;}
  const g=planoGroups().find(x=>x.id===gid);
  const row={id:gid+'__'+slug(nome)+'_'+Date.now().toString(36),group_id:gid,group_label:g.label,group_type:g.type,label:nome,parent_id:null,sort_order:PLANO.length};
  PLANO.push({id:row.id,group_id:gid,group_label:g.label,group_type:g.type,label:nome}); await planoSave(row); closeModal(); render(); toast('Categoria adicionada');
}
async function renomearCat(id){
  const r=PLANO.find(x=>x.id===id); if(!r)return;
  const novo=prompt('Novo nome da categoria:',r.label); if(!novo||!novo.trim())return;
  r.label=novo.trim(); await planoSave({id:r.id,group_id:r.group_id,group_label:r.group_label,group_type:r.group_type,label:r.label,parent_id:null,sort_order:0}); render(); toast('Renomeado');
}
async function delCat(id){
  if(!confirm('Excluir esta categoria? Lançamentos nela ficarão sem categoria.'))return;
  try{ await rpc('fin_plano_delete',{p_id:id}); PLANO=PLANO.filter(x=>x.id!==id); render(); toast('Excluída'); }catch(e){ toast('Erro'); }

let SEL=new Set();
function toggleSel(id,ck){ if(ck)SEL.add(id); else SEL.delete(id); var b=document.getElementById('selBar'); if(b)b.style.display=SEL.size?'flex':'none'; var c=document.getElementById('selCount'); if(c)c.textContent=SEL.size; }
function toggleSelAll(ck){ SEL.clear(); if(ck)LANC.forEach(function(l){SEL.add(l.id);}); render(); }
function limparSel(){ SEL.clear(); render(); }
async function delSelecionados(){
  if(!SEL.size)return;
  if(!confirm('Excluir '+SEL.size+' lançamento(s) selecionado(s)? Esta ação não pode ser desfeita.'))return;
  var ids=Array.from(SEL); toast('Excluindo '+ids.length+'...');
  for(var i=0;i<ids.length;i++){ try{ await rpc('fin_lancamento_delete',{p_id:ids[i]}); LANC=LANC.filter(function(x){return x.id!==ids[i];}); }catch(e){} }
  SEL.clear(); render(); toast('Excluídos: '+ids.length);
}
function catSelecionados(){
  if(!SEL.size)return;
  openModal('<h2>Categorizar '+SEL.size+' selecionado(s)</h2><div class="fg"><label>Categoria</label><select class="in" id="selCat">'+catOptions('')+'</select></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-g" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="aplicarCatSel()">Aplicar</button></div>');

async function aplicarCatSel(){
  var cat=document.getElementById('selCat').value;
  var ids=Array.from(SEL); closeModal(); toast('Aplicando...');
  for(var i=0;i<ids.length;i++){ var l=LANC.find(function(x){return x.id===ids[i];}); if(l)l.category=cat; try{ await saveLanc({id:ids[i],category:cat}); }catch(e){} }
  SEL.clear(); render(); toast('Categorizados: '+ids.length);
}
let _catPickLanc=null;
function openCatPicker(ev,lancId){
  ev.stopPropagation(); _catPickLanc=lancId;
  let p=document.getElementById('catPick');
  if(!p){ p=document.createElement('div'); p.id='catPick'; p.className='catpick'; document.body.appendChild(p); }
  p.innerHTML='<input id="catSearch" class="in" style="width:100%;margin-bottom:6px" placeholder="Buscar categoria..." onkeydown="if(event.key===\'Enter\'){var f=document.querySelector(\'#catList .catopt[data-id]\');if(f)f.click();}" oninput="renderCatList(this.value)"><div id="catList"></div>';
  var r=ev.currentTarget.getBoundingClientRect();
  p.style.left=(window.scrollX+Math.max(8,Math.min(r.left, window.innerWidth-276)))+'px';
  p.style.top=(window.scrollY+r.bottom+4)+'px';
  p.style.display='block';
  renderCatList('');
  setTimeout(function(){var s=document.getElementById('catSearch'); if(s)s.focus();},30);
}
function renderCatList(q){
  q=(q||'').toLowerCase().trim();
  var list=document.getElementById('catList'); if(!list)return;
  var h='';
  if(!q) h+='<div class="catopt" data-id="" onclick="pickCat(\'\')" style="color:var(--muted)">— sem categoria —</div>';
  planoGroups().forEach(function(g){
    var cs=g.cats.filter(function(c){return !q||c.label.toLowerCase().includes(q);});
    if(!cs.length)return;
    h+='<div class="catgrp">'+esc(g.label)+'</div>';
    cs.forEach(function(c){ h+='<div class="catopt" data-id="'+c.id+'" onclick="pickCat(\''+c.id+'\')">'+esc(c.label)+'</div>'; });
  });
  list.innerHTML=h||'<div class="catopt" style="color:var(--muted)">Nada encontrado</div>';
}
async function pickCat(catId){
  var id=_catPickLanc; closeCatPicker();
  if(id){ var l=LANC.find(function(x){return x.id===id;}); if(l)l.category=catId; try{ await saveLanc({id:id,category:catId}); }catch(e){} render(); }
}
function closeCatPicker(){ var p=document.getElementById('catPick'); if(p)p.style.display='none'; _catPickLanc=null; }
document.addEventListener('click',function(e){ var p=document.getElementById('catPick'); if(p&&p.style.display==='block'&&!p.contains(e.target)) closeCatPicker(); });
function exportPDF(){ window.print(); }
function exportXLSX(){
  const wsL=XLSX.utils.json_to_sheet(LANC.map(l=>({Data:fmtData(l.date),Competencia:l.competencia,Descricao:l.memo,Valor:+l.amount,Categoria:catLabel(l.category),Grupo:(catGroup(l.category)||{}).group_label||'',Obs:l.note||'',Manual:l.manual?'sim':''})));
  const doMes=LANC.filter(l=>l.competencia===fechMes);
  const fechRows=[];
  planoGroups().forEach(g=>{ g.cats.forEach(c=>{ const t=doMes.filter(l=>l.category===c.id).reduce((s,l)=>s+ +l.amount,0); if(Math.abs(t)>0.001)fechRows.push({Grupo:g.label,Categoria:c.label,Total:t}); }); });
  fechRows.push({Grupo:'RESULTADO',Categoria:mesLabel(fechMes),Total:doMes.reduce((s,l)=>s+ +l.amount,0)});
  const wsF=XLSX.utils.json_to_sheet(fechRows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,wsL,'Lançamentos');
  XLSX.utils.book_append_sheet(wb,wsF,'Fechamento '+fechMes);
  XLSX.writeFile(wb,'lola-financeiro-'+UNIT+'-'+new Date().toISOString().slice(0,10)+'.xlsx');
}
